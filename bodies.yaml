credentials:

  - id: "cissp"
    name: "CISSP"
    long_name: "Certified Information Systems Security Professional"
    body_id: "isc2"
    body_name: "ISC2"
    unit_label: "CPE"
    unit_note: "ISC2 calls one credit a CPE credit; one hour of qualifying activity is one CPE."
    verified: true
    source_url: "https://www.isc2.org/policies-procedures/member-policies"
    verified_date: "2026-10-20"
    verification_note: "Totals, group split, AMF and the 90-day grace read from the ISC2 member-policies and AMF pages (re-verified 2026-10-20): 120 per three years, Group A 90, Group A or B 30, 40/yr suggested only, USD 135 AMF, 90-day grace, and ISSAP/ISSEP/ISSMP CPEs counting toward CISSP. Rollover terms are unverified; see rollover below."
    caps_known: true
    cycle:
      length_months: 36
      basis: "certification_anniversary"
    requirements:
      cycle_total: 120
      annual_minimum: null
      annual_target: 40
      annual_target_advisory: true
      annual_target_note: "ISC2 states 120 per three-year cycle as the binding requirement and suggests ~40/year as pacing. Registrar treats 40/yr as PACE GUIDANCE, not a hard floor, and says so on every report."
    groups:
      - id: "group_a"
        name: "Group A — directly related to the CISSP domains"
        floor: 90
        cap: null
      - id: "group_b"
        name: "Group B — general professional development"
        floor: null
        cap: 30
    buckets:
      - id: "a_activity"
        name: "Group A activity"
        group: "group_a"
        per_hour: 1.0
        cap: null
        tags: ["training", "conference", "teaching", "materials", "authoring_blog", "authoring_article", "authoring_book", "volunteer", "higher_education", "reading", "chapter_meeting", "cert_exam"]
        requires_markers: ["domain_security"]
      - id: "b_activity"
        name: "Group B activity"
        group: "group_b"
        per_hour: 1.0
        cap: null
        cap_note: "No bucket-level cap: Group B's 30-CPE ceiling is a GROUP limit and is encoded once, on the group. Duplicating it here would trim the bucket first and hide how many hours were actually forfeited."
        tags: ["training", "conference", "teaching", "materials", "authoring_blog", "authoring_article", "authoring_book", "volunteer", "higher_education", "reading", "chapter_meeting", "professional_dev", "work_experience"]
        requires_markers: []
    carryover:
      allowed: true
      max: 40
      group: "group_a"
      window_note: "Only credits earned in the FINAL SIX MONTHS of the prior cycle, in excess of the 120 required, may roll over. No rollover of Group B."
      verified: false
      verified_note: "UNVERIFIED. Source: the ISC2 Certification Maintenance Handbook. Confirm against the current handbook before relying on a rollover figure."
    cross_credential:
      note: "ISC2 states that CPEs satisfying ISSAP / ISSEP / ISSMP requirements automatically count toward the CISSP requirement. If you hold none of those concentrations, this rule does not affect you."
      auto_counts_from: ["issap", "issep", "issmp"]
      verified: true
    submission:
      cadence: "continuous"
      note: "Report as earned through the ISC2 member portal; all credits must be earned and posted by cycle end (plus grace)."
      window: null
    grace_period_days: 90
    fees:
      - name: "Annual Maintenance Fee (AMF)"
        amount_usd: 135
        cadence: "annual"
        due_note: "Due on the certification cycle start date and each annual anniversary."

