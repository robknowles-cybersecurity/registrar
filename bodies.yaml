# Registrar (cpebot) / bodies.yaml — rules file, schema v1
#
# The rules file. One entry per CREDENTIAL TRACK (not per body): several tracks
# can share an issuing body, and the rules that matter — cycle length, caps,
# floors, carryover, submission cadence — are per credential, not per body.
#
# EVERY numeric rule below carries provenance: `source_url` + `verified_date`,
# and a `verified` flag. Anything that could not be read from the issuing
# body's own page on the verified_date is `verified: false` and is rendered
# UNVERIFIED in the web UI and in every renewal report. The engine REFUSES to
# assert compliance for a credential whose binding rules are unverified — see
# `caps_known` and engine.verdict().
#
# Units: bodies call their unit CPE / CEU / ECE / PDU / credit. Internally
# Registrar has ONE unit, the "credit", and each track declares `unit_label` for
# display and `unit_note` for anything the label hides.
#
# Rates: a bucket either has `per_hour` (credits = hours * per_hour) or
# `per_item` (credits = count * per_item). Never both.
#
# Caps: `cap: null` means "no cap declared". Ineligible activity is simply not
# mapped to a bucket rather than being given a zero cap.
#
# Verification: values were checked against each issuing body's own web
# pages. The two ATAP tracks could not be fully confirmed and ship UNVERIFIED;
# the web UI and every report say so — see docs/VERIFICATION.md.

schema_version: 1
