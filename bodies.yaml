# ---------------------------------------------------------------------------
# RESEARCH CATALOG
#
# `programs:` is reference data, NOT engine input. One entry per certifying
# body models its maintenance scheme once, with per-certification totals
# beneath it. The engine scores only `credentials:` above; a catalog
# certification links to an engine track explicitly via `engine_track`.
#
# Provenance on EVERY program, fact, certification and submission item:
#   source_url    the body's own page the value is attributed to
#   source_tier   official_page | official_search_snippet | secondary
#   look_status   READ_OK | CONFIRMED_ABSENT | NOT_READ
#   checked_date  when the source was last checked
#   verified / verified_date  true only for READ_OK on an official_page
#
# READ_OK: the value was read on the official page. CONFIRMED_ABSENT: the page
# was read in full and the item is not there. NOT_READ: the value has not been
# confirmed on the official page and is shown as unverified.
#
# `landing:` holds the one-line summaries the landing page's "How each body
# counts" section is built from (webapp/tools/site_rules.mjs; `npm run build`
# rewrites the section). They summarise the provenance-bearing values above
# and carry none of their own. `{unverified}` marks where the UNVERIFIED
# badge goes; `cycle_unverified: true` puts it on the cycle length.
# ---------------------------------------------------------------------------

